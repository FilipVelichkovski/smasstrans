name: Build Signed Android ARM64 APK

on:
  workflow_dispatch:
    inputs:
      build_configuration:
        description: 'Build Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build-apk:
    name: Build Signed ARM64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Install Android and MAUI Workloads
        run: |
          dotnet workload install android maui-android

      - name: Prepare Signing Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using provided repository secrets for keystore"
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "store_pass=${KEYSTORE_PASS_SECRET}" >> "$GITHUB_OUTPUT"
            echo "key_alias=${KEY_ALIAS_SECRET:-smasstrans}" >> "$GITHUB_OUTPUT"
            echo "key_pass=${KEYSTORE_PASS_SECRET}" >> "$GITHUB_OUTPUT"
          else
            echo "Generating self-signed release keystore for build"
            GEN_PASS="smasstrans-build-pass"
            keytool -genkey -v -keystore release.keystore -alias smasstrans \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$GEN_PASS" -keypass "$GEN_PASS" \
              -dname "CN=SMassTrans, OU=SilverCraft, O=SilverCraft, L=Skopje, C=MK"
            echo "store_pass=$GEN_PASS" >> "$GITHUB_OUTPUT"
            echo "key_alias=smasstrans" >> "$GITHUB_OUTPUT"
            echo "key_pass=$GEN_PASS" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Build and Native .so / AOT Artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            SMassTrans.Avalonia.Android/obj
            SMassTrans.Avalonia/obj
            SMassTrans.Shared/obj
          key: ${{ runner.os }}-android-arm64-obj-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-android-arm64-obj-

      - name: Restore Dependencies
        run: |
          dotnet restore SMassTrans.Avalonia.Android/SMassTrans.Avalonia.Android.csproj --warnaserror:false

      - name: Publish Signed ARM64 APK
        env:
          CONFIG: ${{ inputs.build_configuration }}
          STORE_PASS: ${{ steps.keystore.outputs.store_pass }}
          KEY_ALIAS: ${{ steps.keystore.outputs.key_alias }}
          KEY_PASS: ${{ steps.keystore.outputs.key_pass }}
        run: |
          KEYSTORE_PATH="$(pwd)/release.keystore"
          dotnet publish SMassTrans.Avalonia.Android/SMassTrans.Avalonia.Android.csproj \
            -c "$CONFIG" \
            -f net10.0-android \
            -r android-arm64 \
            --warnaserror:false \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$KEYSTORE_PATH" \
            -p:AndroidSigningStorePass="$STORE_PASS" \
            -p:AndroidSigningKeyAlias="$KEY_ALIAS" \
            -p:AndroidSigningKeyPass="$KEY_PASS"

      - name: Collect APK Artifact
        run: |
          mkdir -p output_apk
          find SMassTrans.Avalonia.Android/bin -type f -name "*Signed*.apk" -exec cp {} output_apk/ \; 2>/dev/null || true
          if [ -z "$(ls -A output_apk)" ]; then
            find SMassTrans.Avalonia.Android/bin -type f -name "*arm64*.apk" -exec cp {} output_apk/ \; 2>/dev/null || true
          fi
          if [ -z "$(ls -A output_apk)" ]; then
            find SMassTrans.Avalonia.Android/bin -type f -name "*.apk" -exec cp {} output_apk/ \; 2>/dev/null || true
          fi
          echo "Collected APKs:"
          ls -la output_apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smasstrans-arm64-apk
          path: output_apk/*.apk
          if-no-files-found: error
