image: registry.gitlab.com/silvercraft/dotnet-android-build-image:latest

variables:
  OBJECTS_DIRECTORY: 'obj'
  NUGET_PACKAGES_DIRECTORY: '.nuget'
  SOURCE_CODE_PATH: '*/*/'
  GIT_SUBMODULE_STRATEGY: recursive

cache:
  key: "$CI_JOB_STAGE-$CI_COMMIT_REF_SLUG"
  paths:
    - '$SOURCE_CODE_PATH$OBJECTS_DIRECTORY/project.assets.json'
    - '$SOURCE_CODE_PATH$OBJECTS_DIRECTORY/*.csproj.nuget.*'
    - '$NUGET_PACKAGES_DIRECTORY'
  policy: pull-push

stages:
  - build
build-desktop:
  stage: build
  script:
    - 'apt update && apt -y install libfuse2 fuse file desktop-file-utils zsync appstream' 
    - 'cd SMassTrans.Avalonia.Desktop/'
    - 'dotnet workload restore --project SMassTrans.Avalonia.Desktop.csproj'
    - 'dotnet restore --force'
    - 'dotnet publish -c Release -r linux-x64 -f net8.0 --self-contained true'
    - 'cd bin/Release/net8.0/linux-x64/'
    - 'bash ../../../../publish-appimg.sh'
    - 'cp SMassTrans-x86_64.AppImage $CI_PROJECT_DIR/'
  artifacts:
    expire_in: 1 week  
    paths:
      - 'SMassTrans-x86_64.AppImage'

build-windows:
  stage: build
  script:
    - 'cd SMassTrans.Avalonia.Desktop/'
    - 'dotnet workload restore --project SMassTrans.Avalonia.Desktop.csproj --packages ../$NUGET_PACKAGES_DIRECTORY'
    - 'dotnet restore --force --packages ../$NUGET_PACKAGES_DIRECTORY'
    - 'dotnet publish -c Release -r win-x64 -f net8.0 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true'
    - 'cd ../'
    - 'cp SMassTrans.Avalonia.Desktop/bin/Release/net8.0/win-x64/publish/*.exe .'
  artifacts:
    expire_in: 1 week
    paths:
      - '*.exe'

build-mobile:
  stage: build
  script:
    - 'cd SMassTrans.Avalonia.Android/'
    - 'dotnet workload restore --project SMassTrans.Avalonia.Android.csproj --packages ../$NUGET_PACKAGES_DIRECTORY'
    - 'echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release-smassstrans.jks'
    - 'dotnet restore --force --packages ../$NUGET_PACKAGES_DIRECTORY'
    - |
      dotnet publish -c Release -f net10.0-android --no-restore \
      -p:AndroidKeyStore=True \
      -p:AndroidSigningKeyStore=release-smassstrans.jks \
      -p:AndroidSigningStorePass=$ANDROID_KEYSTORE_PASSWORD \
      -p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS \
      -p:AndroidSigningKeyPass=$ANDROID_KEYSTORE_PASSWORD \
      -p:AndroidSdkDirectory=/usr/lib/android-sdk/ \
      -p:JavaSdkDirectory=$JAVA_HOME
    - 'cd ..'
    - 'cp SMassTrans.Avalonia.Android/bin/Release/net10.0-android/publish/*.apk .'
  artifacts:
    expire_in: 1 week
    paths:
      - '*.apk'
build-macos-arm64:
  stage: build
  script:
    - 'cd SMassTrans.Avalonia.Desktop/'
    - 'dotnet workload restore'
    - 'dotnet publish -c Release -r osx-arm64 -f net8.0 --self-contained true -p:PublishSingleFile=true'
    - 'mkdir -p $CI_PROJECT_DIR/SMassTrans.app/Contents/MacOS'
    - 'mkdir -p $CI_PROJECT_DIR/SMassTrans.app/Contents/Resources'
    - 'cp -r bin/Release/net8.0/osx-arm64/publish/* $CI_PROJECT_DIR/SMassTrans.app/Contents/MacOS/'
    - |
      echo '<?xml version="1.0" encoding="UTF-8"?>
      <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
      <plist version="1.0">
      <dict>
          <key>CFBundleExecutable</key>
          <string>SMassTrans.Avalonia.PC</string>
          <key>CFBundleIdentifier</key>
          <string>uk.silverdiamond.smasstrans</string>
          <key>CFBundleName</key>
          <string>SMassTrans</string>
          <key>CFBundlePackageType</key>
          <string>APPL</string>
          <key>CFBundleShortVersionString</key>
          <string>1.0</string>
      </dict>
      </plist>' > $CI_PROJECT_DIR/SMassTrans.app/Contents/Info.plist
  artifacts:
    paths:
      - 'SMassTrans.app/'
build-windows-arm64:
  stage: build
  script:
    - 'cd SMassTrans.Avalonia.Desktop/'
    - 'dotnet workload restore --project SMassTrans.Avalonia.Desktop.csproj --packages ../$NUGET_PACKAGES_DIRECTORY'
    - 'dotnet restore --force --packages ../$NUGET_PACKAGES_DIRECTORY'
    - 'dotnet publish -c Release -r win-arm64 -f net8.0 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true'
    - 'cd ../'
    - 'mkdir -p win-arm64-output'
    - 'cp SMassTrans.Avalonia.Desktop/bin/Release/net8.0/win-arm64/publish/*.exe ./win-arm64-output/'
  artifacts:
    expire_in: 1 week
    paths:
      - 'win-arm64-output/*.exe'
build-linux-arm64:
  stage: build
  script:
    - 'apt update && apt -y install libfuse2 fuse file desktop-file-utils zsync appstream' 
    - 'cd SMassTrans.Avalonia.Desktop/'
    - 'dotnet workload restore --project SMassTrans.Avalonia.Desktop.csproj'
    - 'dotnet restore --force'
    # Build for Linux ARM64
    - 'dotnet publish -c Release -r linux-arm64 -f net8.0 --self-contained true'
    - 'cd bin/Release/net8.0/linux-arm64/'
    - 'bash ../../../../publish-appimg.sh aarch64'
    - 'cp SMassTrans-aarch64.AppImage $CI_PROJECT_DIR/'
  artifacts:
    expire_in: 1 week
    paths:
      - 'SMassTrans-aarch64.AppImage'