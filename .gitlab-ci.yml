image: registry.gitlab.com/silvercraft/dotnet-android-build-image:latest

variables:
  OBJECTS_DIRECTORY: 'obj'
  NUGET_PACKAGES_DIRECTORY: '.nuget'
  SOURCE_CODE_PATH: '*/*/'
  GIT_SUBMODULE_STRATEGY: recursive

cache:
  key: "$CI_JOB_STAGE-$CI_COMMIT_REF_SLUG"
  paths:
    - '$SOURCE_CODE_PATH$OBJECTS_DIRECTORY/project.assets.json'
    - '$SOURCE_CODE_PATH$OBJECTS_DIRECTORY/*.csproj.nuget.*'
    - '$NUGET_PACKAGES_DIRECTORY'
  policy: pull-push

stages:
  - build

build-desktop:
  stage: build
  script:
    - 'apt update && apt -y install libfuse2 fuse file desktop-file-utils zsync appstream' 
    - 'dotnet workload restore --project SMassTrans.Avalonia.Desktop/SMassTrans.Avalonia.Desktop.csproj --packages $NUGET_PACKAGES_DIRECTORY'
    - 'dotnet restore --force --packages $NUGET_PACKAGES_DIRECTORY'
    - 'dotnet publish SMassTrans.Avalonia.Desktop/SMassTrans.Avalonia.Desktop.csproj -c Release -r linux-x64 -f net8.0 --self-contained true'
    - 'cd SMassTrans.Avalonia.Desktop/bin/Release/net8.0/linux-x64/'
    - 'bash ../../../../publish-appimg.sh'
    - 'mkdir -p ../../../../out-linux'
    - 'cp SMassTrans-x86_64.AppImage ../../../../out-linux/'
  artifacts:
    expire_in: 1 week  
    paths:
      - 'out-linux/SMassTrans-x86_64.AppImage'

build-windows:
  stage: build
  script:
    - 'cd SMassTrans.Avalonia.Desktop/'
    - 'dotnet workload restore --project SMassTrans.Avalonia.Desktop.csproj --packages ../$NUGET_PACKAGES_DIRECTORY'
    - 'dotnet restore --force --packages ../$NUGET_PACKAGES_DIRECTORY'
    - 'dotnet publish -c Release -r win-x64 -f net8.0 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true'
    - 'cd ../'
    - 'mkdir -p out-windows'
    - 'cp SMassTrans.Avalonia.Desktop/bin/Release/net8.0/win-x64/publish/*.exe out-windows/'
  artifacts:
    expire_in: 1 week
    paths:
      - 'out-windows/'

build-mobile:
  stage: build
  script:
    - 'cd SMassTrans.Avalonia.Android/'
    - 'dotnet workload restore --project SMassTrans.Avalonia.Android.csproj --packages ../$NUGET_PACKAGES_DIRECTORY'
    - 'echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release-smassstrans.jks'
    - 'dotnet restore --force --packages ../$NUGET_PACKAGES_DIRECTORY'
    - |
      dotnet publish -c Release -f net10.0-android --no-restore \
      -p:AndroidKeyStore=True \
      -p:AndroidSigningKeyStore=release-smassstrans.jks \
      -p:AndroidSigningStorePass=$ANDROID_KEYSTORE_PASSWORD \
      -p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS \
      -p:AndroidSigningKeyPass=$ANDROID_KEYSTORE_PASSWORD \
      -p:AndroidSdkDirectory=/usr/lib/android-sdk/ \
      -p:JavaSdkDirectory=$JAVA_HOME
    - 'cd ..'
    - 'mkdir -p out-mobile'
    - 'cp SMassTrans.Avalonia.Android/bin/Release/net10.0-android/publish/*.apk out-mobile/'
  artifacts:
    expire_in: 1 week
    paths:
      - 'out-mobile/'